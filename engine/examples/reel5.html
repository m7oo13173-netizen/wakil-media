<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../lib/base.css">
<style>
#bgA{background:radial-gradient(circle at 50% 30%,#3a2a5c 0%,#1b1530 70%)}
#bgR{background:radial-gradient(circle at 50% 30%,#5c1f2a 0%,#24101a 75%)}
#bgG{background:radial-gradient(circle at 50% 30%,#0f5c4c 0%,#0a2a26 75%)}
.badge{width:300px;height:300px;border-radius:50%;background:#e5383b;left:50%;margin-left:-150px;display:flex;align-items:center;justify-content:center;font-family:CairoL;font-weight:900;font-size:230px;color:#fff;box-shadow:0 14px 0 #8d1d20}
.mcard{left:70px;right:70px;top:150px;background:#fff;color:#1b1530;border-radius:40px;padding:26px 36px;display:flex;align-items:center;gap:30px;box-shadow:0 18px 0 rgba(0,0,0,.25)}
.mnum{flex:none;width:130px;height:130px;border-radius:50%;background:#e5383b;color:#fff;font-family:CairoL;font-weight:900;font-size:90px;display:flex;align-items:center;justify-content:center;position:relative}
.mnum:after{content:'';position:absolute;inset:-8px;border-radius:50%;border:6px solid #e5383b;opacity:.35}
.mtxt{font-weight:900;font-size:64px;line-height:1.2}
.mtxt small{display:block;font-size:40px;font-weight:700;color:#6b5b7b}
.bub{position:absolute;padding:20px 32px;border-radius:30px;font-size:52px;font-weight:700;color:#111;background:#dcf8c6;box-shadow:0 4px 0 rgba(0,0,0,.15);white-space:nowrap}
.stamp{left:50%;top:760px;margin-left:-260px;width:520px;text-align:center;border:12px solid #e5383b;color:#e5383b;font-weight:900;font-size:110px;border-radius:30px;background:rgba(255,255,255,.92)}
.clockb{left:50%;top:520px;margin-left:-240px;width:480px;white-space:nowrap;background:#ffd23f;color:#1b1530;border-radius:60px;text-align:center;font-weight:900;font-size:64px;padding:8px 0}
.bill{position:absolute;width:210px;height:110px;border-radius:14px;background:linear-gradient(135deg,#3fbf6f,#1e8a4a);border:6px solid #b8f0c9;color:#eafff0;font-weight:900;font-size:44px;display:flex;align-items:center;justify-content:center}
.wallet{left:50%;top:880px;margin-left:-190px;width:380px;height:240px;background:#6b3e1f;border-radius:36px;box-shadow:inset 0 -20px 0 #4e2c15}
.row{left:90px;right:90px;height:150px;background:rgba(255,255,255,.1);border:4px solid rgba(255,255,255,.25);border-radius:40px;display:flex;align-items:center;gap:30px;padding:0 34px;font-weight:900;font-size:58px}
.ok{flex:none;width:100px;height:100px;border-radius:50%;background:#3ee6b5;position:relative}
.ok:after{content:'';position:absolute;left:30px;top:18px;width:30px;height:52px;border:solid #0a2a26;border-width:0 14px 14px 0;transform:rotate(45deg)}
</style></head><body>
<div id="stage">
  <div class="bg" id="bgA"></div><div class="bg" id="bgR" style="opacity:0"></div><div class="bg" id="bgG" style="opacity:0"></div>

  <!-- hook -->
  <div class="abs badge" id="b3" style="top:170px">3</div>
  <div class="abs title" id="h1" style="top:500px;font-size:96px">أخطاء تخسّرك <b>عملاء</b></div>
  <div class="abs title" id="h2" style="top:640px;font-size:64px;color:#ffb3b3">…وأنت ما تدري!</div>

  <!-- mistake cards -->
  <div class="abs mcard" id="m1"><div class="mnum">1</div><div class="mtxt">ترد متأخر<small>العميل ما ينتظر</small></div></div>
  <div class="abs mcard" id="m2"><div class="mnum">2</div><div class="mtxt">أسعارك مو واضحة<small>والعميل يمل من الأسئلة</small></div></div>
  <div class="abs mcard" id="m3"><div class="mnum">3</div><div class="mtxt">ما تتابع اللي ما حجزوا<small>فلوس طايرة!</small></div></div>

  <!-- m1 visual -->
  <div class="bub" id="q1" style="right:120px;top:420px">كم السعر؟</div>
  <div class="abs clockb" id="ck">بعد 5 ساعات…</div>
  <div class="abs stamp" id="st1">راح لغيرك</div>

  <!-- m2 visual -->
  <div class="bub" id="qa" style="right:90px;top:430px">كم السعر؟</div>
  <div class="bub" id="qb" style="left:90px;top:560px;background:#fff">فيه عروض؟</div>
  <div class="bub" id="qc" style="right:150px;top:690px">كم الحجز؟</div>
  <div class="bub" id="qd" style="left:140px;top:820px;background:#fff">طيب كم؟؟</div>
  <div class="bub" id="qe" style="right:260px;top:950px;font-size:80px">؟؟؟</div>

  <!-- m3 visual -->
  <div class="abs wallet" id="wal"></div>
  <div id="bills"></div>

  <!-- solution -->
  <div class="abs title" id="s1" style="top:140px;font-size:110px">الحل؟ <b>وكيل ذكي</b></div>
  <div class="abs row" id="r1" style="top:430px"><div class="ok"></div>يرد خلال ثواني</div>
  <div class="abs row" id="r2" style="top:610px"><div class="ok"></div>يعطي الأسعار فوراً</div>
  <div class="abs row" id="r3" style="top:790px"><div class="ok"></div>يتابع اللي ما حجزوا</div>

  <img class="pose" id="p_shock" src="../mascot/pose_shock.png">
  <img class="pose" id="p_shrug" src="../mascot/pose_shrug.png">
  <img class="pose" id="p_think" src="../mascot/pose_think.png">
  <img class="pose" id="p_scheme" src="../mascot/pose_scheme.png">
  <img class="pose" id="p_point" src="../mascot/pose_point.png">
  <div class="flash" id="flash"></div>
</div>
<script src="../lib/lib.js"></script>
<script>
// Cue times (seconds) — overwritten from the voiceover's word timings at render time.
let C={m1:3.0,m2:7.5,m3:12.0,sol:17.0,A:21.5,D:23.8};
const bills=$('bills');
for(let i=0;i<7;i++){const b=document.createElement('div');b.className='bill';b.id='bl'+i;b.textContent='ريال';b.style.left=(330+((i*97)%260))+'px';b.style.top='900px';bills.appendChild(b);}
function setT(T){
  const {m1,m2,m3,sol,A}=C;
  // backgrounds
  $('bgR').style.opacity=lin(T,m1-.2,m1+.2)*(1-lin(T,sol-.2,sol+.2));
  $('bgG').style.opacity=lin(T,sol-.2,sol+.2);
  // hook
  popEl('b3',T,0.05,m1);
  $('b3').style.transform+=` rotate(${Math.sin(T*6)*4}deg)`;
  popEl('h1',T,0.05,m1); popEl('h2',T,0.7,m1);
  pose('shock',T,0,m1,{sc:.8,bob:5,rot:1.5});
  // mistake 1
  popEl('m1',T,m1,m2);
  popEl('q1',T,m1+.4,m2); $('q1').style.transformOrigin='100% 50%';
  popEl('ck',T,m1+1.2,m2); $('ck').style.transform+=` rotate(${Math.sin(T*10)*3}deg)`;
  popEl('st1',T,m1+2.2,m2,{fi:.2}); $('st1').style.transform+=' rotate(-8deg)';
  pose('shrug',T,m1,m2,{sc:.72,bob:5});
  // mistake 2
  popEl('m2',T,m2,m3);
  ['qa','qb','qc','qd','qe'].forEach((q,i)=>{popEl(q,T,m2+.35+i*.55,m3,{fi:.25});
    if(T>m2+3.2) $(q).style.transform+=` translateX(${Math.sin(T*40+i)*6}px)`;});
  pose('think',T,m2,m3,{sc:.68,x:0,bob:4});
  // mistake 3
  popEl('m3',T,m3,sol);
  popEl('wal',T,m3+.3,sol);
  for(let i=0;i<7;i++){const b=$('bl'+i),s=m3+1.0+i*.35,k=lin(T,s,s+1.6);
    b.style.opacity=(T>=s&&T<sol)?(1-lin(T,s+1.1,s+1.6)):0;
    b.style.transform=`translate(${Math.sin(i*2.1)*260*k}px,${-620*k+80*k*k}px) rotate(${(i%2?1:-1)*220*k}deg)`;}
  pose('point',T,m3,sol,{sc:.68,bob:5});
  // solution
  $('flash').style.opacity=(T>=sol-.05&&T<sol+.3)?1-lin(T,sol,sol+.3):0;
  popEl('s1',T,sol+.05,A);
  popEl('r1',T,sol+.6,A); popEl('r2',T,sol+1.1,A); popEl('r3',T,sol+1.6,A);
  pose('scheme',T,sol,A,{sc:.72,bob:6});
  yalla(T,A);
}
injectYalla(); setT(0);
</script></body></html>
